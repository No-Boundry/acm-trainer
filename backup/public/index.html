<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACM 训练模式</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231e90ff'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Consolas,monospace' font-weight='bold'%3EA%2B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-logo">A+</span>
    <div class="brand-text">
      <div class="brand-title">ACM 训练模式</div>
      <div class="brand-sub" id="brand-sub">本地判题 · XCPC 训练计划</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="problems">题库</button>
    <button class="tab" data-tab="plan">训练计划</button>
    <button class="tab" data-tab="notes">笔记计划</button>
    <button class="tab" data-tab="stats">统计</button>
    <button class="tab" data-tab="coach">AI 教练</button>
  </nav>
  <div class="topbar-right">
    <span class="server-dot" id="server-dot" title="服务器连接状态"></span>
    <span id="server-status">连接中…</span>
  </div>
</header>

<main id="view" class="view"></main>

<footer class="footer">
  <span>AC = All Clear · WA = Wrong Answer · TLE = Time Limit Exceeded · MLE = Memory Limit Exceeded · RE = Runtime Error · CE = Compile Error · OLE = Output Limit Exceeded</span>
</footer>

<script src="js/app.js"></script>
</body>
</html>
